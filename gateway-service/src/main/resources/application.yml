spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/customers/**
        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
server:
  port: 8888
